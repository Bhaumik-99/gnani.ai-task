name: CI
on:
  push:
    branches: [main, "work/**", "feat/**"]
  pull_request:
    branches: [main]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e "backend[dev]"
      - run: ruff check backend/app backend/tests backend/evaluation
      - run: cd backend && pytest -q
      - run: cd backend && python -m evaluation.evaluate_rules --dataset evaluation/datasets/rules_smoke.jsonl
      - run: cd backend && python -m evaluation.evaluate_transcripts --dataset evaluation/datasets/transcripts_smoke.jsonl
      - run: cd backend && python -m evaluation.evaluate_latency --dataset evaluation/datasets/latency_smoke.jsonl
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: cd frontend && npm install
      - run: cd frontend && npm run build
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp backend/.env.example backend/.env
      - run: cp .env.compose.example .env
      - run: docker compose config --quiet
